<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cosy Farm" />
  <meta name="theme-color" content="#cfe6ee" />
  <title>Cosy Farm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐔%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="canvas" aria-label="Ferme en 3D"></canvas>

    <header id="hud">
      <div class="chip" id="dayChip">Lundi · J1</div>
      <div class="chip" id="coinChip">🪙 280</div>
      <div class="chip" id="energyChip">⚡ 15/15</div>
    </header>
    <div id="hint" role="status"></div>

    <div id="placebar" class="bar hidden">
      <div id="placeMsg"></div>
      <div class="row">
        <button class="btn ghost" data-act="place-cancel">✕ Annuler</button>
        <button class="btn primary" data-act="place-ok" id="placeOk">✓ Placer</button>
      </div>
    </div>

    <div id="nesttop" class="chip hidden">Poulailler</div>
    <div id="nestbar" class="bar hidden">
      <div id="nestMsg"></div>
      <div class="row">
        <button class="btn ghost" data-act="nest-back">← Retour</button>
        <button class="btn" data-act="nest-clean" id="nestClean">🧹 Nettoyer</button>
        <button class="btn" data-act="nest-brood" id="nestBrood">🐣 Couver</button>
      </div>
    </div>

    <nav id="dock">
      <button class="tab" data-panel="shop"><i>🛒</i>Boutique<b class="dot hidden"></b></button>
      <button class="tab" data-panel="hens"><i>🐔</i>Poules<b class="dot hidden"></b></button>
      <button class="tab" data-panel="farm"><i>🌾</i>Ferme<b class="dot hidden"></b></button>
      <button class="tab" data-panel="market"><i>🧺</i>Marché<b class="dot hidden"></b></button>
      <button class="tab night" data-act="sleep" id="sleepBtn"><i>🌙</i><span id="sleepLabel">Passer la nuit</span></button>
    </nav>

    <section id="sheet" class="hidden" aria-live="polite"></section>
    <div id="modal" class="hidden"></div>
    <div id="fade" class="hidden"><span>🌙 La nuit passe…</span></div>
    <div id="toast" class="hidden" role="status"></div>
    <div id="boot"><div>🐔<p>Cosy Farm</p></div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
